    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;

            color: white;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .gradient-text {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-enter {
            opacity: 0;

            animation: fadeInUp 0.5s ease-out forwards;
        }


        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {

                    const data = await res.json();
                    if (data.athletes) {

                                displayName: athlete.displayName,

        const formatDateParam = (date) => date.toISOString().split('T')[0].replace(/-/g, '');


        const formatDisplayDate = (dateString) => {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        };

        const fetchGamesForDate = async (date) => {
            try {
                const dateStr = formatDateParam(date);
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${dateStr}`);
                const data = await response.json();
                return transformEspnData(data);
            } catch (error) {
                console.error(`Failed to fetch scores for ${dateStr}:`, error);
                return [];
            }
        };

        const fetchGameDetails = async (gameId) => {
            try {
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${gameId}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Failed to fetch game details:", error);
                return null;
            }
        };

        const transformEspnData = (data) => {
            if (!data || !data.events) return [];

            return data.events.map(event => {
                const competition = event.competitions[0];
                const statusState = event.status.type.state;


                const home = competition.competitors.find(c => c.homeAway === 'home');
                const visitor = competition.competitors.find(c => c.homeAway === 'away');


                let status = 'Scheduled';
                if (statusState === 'in') status = 'Live';
                if (statusState === 'post') status = 'Final';


                const odds = competition.odds?.[0];
                const bettingLine = odds?.details;
                const overUnder = odds?.overUnder;
                const venue = competition.venue?.fullName;


                let topPerformer = null;


                const homeLeaders = home.leaders?.find(l => l.name === 'points')?.leaders?.[0];
                const visitorLeaders = visitor.leaders?.find(l => l.name === 'points')?.leaders?.[0];

                if (homeLeaders || visitorLeaders) {
                    const hVal = homeLeaders?.value || 0;
                    const vVal = visitorLeaders?.value || 0;
                    const leader = hVal >= vVal ? homeLeaders : visitorLeaders;

                    if (leader) {
                        topPerformer = {
                            name: leader.athlete.shortName,
                            value: leader.displayValue,
                            headshot: leader.athlete.headshot,
                            teamLogo: hVal >= vVal ? home.team.logo : visitor.team.logo
                        };
                    }
                }

                return {
                    id: event.id,
                    date: event.date,
                    status: status,
                    period: event.status.period,
                    clock: event.status.displayClock,
                    time: event.status.type.shortDetail,
                    odds: {
                        line: bettingLine,
                        overUnder: overUnder
                    },
                    venue: venue,
                    topPerformer: topPerformer,
                    home_team: {
                        id: home.id,
                        name: home.team.name,
                        full_name: home.team.displayName,
                        abbreviation: home.team.abbreviation,
                        score: parseInt(home.score),
                        logo: home.team.logo || 'https://via.placeholder.com/32',
                        record: home.records?.[0]?.summary
                    },
                    visitor_team: {
                        id: visitor.id,
                        name: visitor.team.name,
                        full_name: visitor.team.displayName,
                        abbreviation: visitor.team.abbreviation,
                        score: parseInt(visitor.score),
                        logo: visitor.team.logo || 'https://via.placeholder.com/32',
                        record: visitor.records?.[0]?.summary
                    }
                };
            });
        };




        const StatusBadge = ({ game }) => {
            const { status, clock, period, time, date } = game;

            if (status === 'Live') {
                return (
                    <div className="flex items-center gap-2">
                        <span className="relative flex h-2.5 w-2.5">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                        </span>
                        <span className="text-red-500 font-bold text-xs uppercase tracking-wider">
                            Q{period} • {clock}
                        </span>
                    </div>
                );
            }
            if (status === 'Final') {
                return <span className="text-slate-400 font-medium text-xs uppercase tracking-wider">{formatDisplayDate(date)}</span>;
            }

            return <span className="text-blue-400 font-medium text-xs uppercase tracking-wider">{time}</span>;
        };


        const TeamRow = ({ team, isWinner, isScheduled }) => (
            <div className={`flex items-center justify-between py-2 ${isWinner ? 'font-bold text-white' : 'text-slate-300'}`}>
                <div className="flex items-center gap-3">
                    <img
                        src={team.logo}
                        alt={team.name}
                        className="w-8 h-8 object-contain drop-shadow-md"
                        onError={(e) => { e.target.src = 'https://via.placeholder.com/32?text=' + team.abbreviation; }}
                    />
                    <div className="flex flex-col relative">
                        <span className="text-lg leading-tight">{team.full_name}</span>
                        {team.record && <span className="text-[10px] text-slate-500 font-mono absolute -bottom-3 left-0">{team.record}</span>}
                    </div>
                </div>
                {!isScheduled && (
                    <span className="text-2xl font-mono tracking-tighter">{team.score}</span>
                )}
            </div>

        const ScoreCard = ({ game, index = 0, onClick }) => {
            const isScheduled = game.status === 'Scheduled';
            const homeWinner = !isScheduled && game.home_team.score > game.visitor_team.score;
            const visitorWinner = !isScheduled && game.visitor_team.score > game.home_team.score;

            const effectiveIndex = index % 9;

            return (
                <div
                    onClick={() => onClick(game)}
                    className="glass-panel rounded-2xl p-5 hover:bg-slate-800/50 transition-all duration-300 hover:scale-[1.02] cursor-pointer group hover:ring-1 hover:ring-blue-500/50 animate-fade-in flex flex-col justify-between min-h-[220px]"
                >
                    { }
                    <div>
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-white/5">
                            <StatusBadge game={game} />
                            <span className="text-xs text-slate-600 font-mono group-hover:text-blue-400 transition-colors">ESPN</span>
                        </div>

                        <div className="space-y-4 mb-4">
                            <TeamRow team={game.visitor_team} isWinner={visitorWinner} isScheduled={isScheduled} />
                            <TeamRow team={game.home_team} isWinner={homeWinner} isScheduled={isScheduled} />
                        </div>
                    </div>

                    { }
                    <div className="pt-3 border-t border-white/5 mt-auto">
                        {isScheduled ? (
                            <div className="flex items-center justify-between text-xs text-slate-500">
                                <div className="flex flex-col">

                                </div>
                                <div className="flex flex-col text-right">
                                    <span className="font-bold text-slate-400">VENUE</span>
                                    <span className="truncate max-w-[120px]">{game.venue || 'TBA'}</span>
                                </div>
                            </div>
                        ) : game.topPerformer ? (
                            <div className="flex items-center gap-3 bg-slate-800/40 rounded-lg p-2">
                                <img src={game.topPerformer.headshot || 'https://via.placeholder.com/24'} className="w-8 h-8 rounded-full object-cover ring-1 ring-white/10" />
                                <div className="flex flex-col">
                                    <span className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Top Performer</span>
                                    <span className="text-xs text-white font-medium">
                                        {game.topPerformer.name} <span className="text-blue-400 font-mono ml-1">{game.topPerformer.value} PTS</span>
                                    </span>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center text-xs text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity py-2">
                                View Details →
                            </div>
                        )}
                    </div>
                </div>
            );
        };


        const GameGrid = ({ games, title, onLoadMore, isLoadingMore, loadingInitial, onCardClick }) => {
            if (!loadingInitial && games.length === 0 && !isLoadingMore) return (
                <div className="mb-12 opacity-60">
                    <h2 className="text-2xl font-bold mb-4">{title}</h2>
                    <p>No games available.</p>
                    <button onClick={onLoadMore} className="mt-2 text-blue-400 text-sm hover:underline">Load next day</button>
                </div>
            );

            return (
                <div className="mb-12">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                            {title}
                            <span className="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 text-xs font-normal">
                                {games.length}
                            </span>
                        </h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                        {games.map((game, index) => (
                            <ScoreCard key={game.id} game={game} index={index} onClick={onCardClick} />
                        ))}
                    </div>

                    <div className="flex justify-center">
                        <button
                            onClick={onLoadMore}
                            disabled={isLoadingMore}
                            className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-full font-medium transition-all hover:ring-2 hover:ring-blue-500/50 flex items-center gap-2 group disabled:opacity-50"
                        >
                            {isLoadingMore ? 'Loading...' : 'Show More'}
                            {!isLoadingMore && <svg className="w-4 h-4 group-hover:translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>}
                        </button>
                    </div>
                </div>
            );
        };


        const transformGameDetails = (data) => {
            if (!data) return null;


            const getAthleteStats = (athleteId, teamId) => {
                const teamBox = data.boxscore?.players?.find(t => t.team.id === teamId);
                const athlete = teamBox?.statistics?.[0]?.athletes?.find(a => a.athlete.id === athleteId);
                return athlete?.stats || [];
            };


            const mappedLeaders = data.leaders?.map(teamLeader => ({
                team: teamLeader.team,
                leaders: teamLeader.leaders?.map(category => {
                    const topPlayer = category.leaders?.[0];
                    if (!topPlayer) return null;

                    const fullStats = getAthleteStats(topPlayer.athlete.id, teamLeader.team.id);


                    return {
                        ...topPlayer,
                        category: category.displayName,
                        richStats: {
                            pts: fullStats[1] || topPlayer.displayValue,
                            reb: fullStats[5] || '-',
                            ast: fullStats[6] || '-'
                        }
                    };
                }).filter(Boolean)

        const fetchStandings = async () => {
            const data = await fetchWithFallback('https://site.api.espn.com/apis/v2/sports/basketball/nba/standings');
            if (!data) return null;
            return transformStandings(data);
        };

        const transformStandings = (data) => {
            if (!data?.children) return { east: [], west: [], general: [] };

            const east = data.children.find(c => c.name === 'Eastern Conference')?.standings?.entries || [];
            const west = data.children.find(c => c.name === 'Western Conference')?.standings?.entries || [];

            const mapEntry = (entry) => {
                const stats = entry.stats;
                const getStat = (name) => stats.find(s => s.name === name)?.displayValue || '0';

                return {
                    id: entry.team.id,
                    rank: 0,
                    team: {
                        name: entry.team.displayName,
                        logo: entry.team.logos?.[0]?.href || 'https://via.placeholder.com/32',
                        abbreviation: entry.team.abbreviation
                    },
                    wins: getStat('wins'),
                    losses: getStat('losses'),
                    pct: getStat('winPercent'),
                    gb: getStat('gamesBehind'),
                    l10: getStat('lastTen'),
                    streak: getStat('streak'),
                    diff: getStat('pointDifferential')
                };
            };


            const getPct = (t) => {
                const p = parseFloat(t.pct);
                return isNaN(p) ? 0 : p;
            };
            const sortByPct = (a, b) => getPct(b) - getPct(a);


            let eastTeams = east.map(mapEntry).sort(sortByPct).map((t, i) => ({ ...t, rank: i + 1 }));
            let westTeams = west.map(mapEntry).sort(sortByPct).map((t, i) => ({ ...t, rank: i + 1 }));
            let generalTeams = [...eastTeams, ...westTeams].sort(sortByPct).map((t, i) => ({ ...t, rank: i + 1 }));

            return { east: eastTeams, west: westTeams, general: generalTeams };
        };




        const fetchWithFallback = async (url) => {
            try {

                const res = await fetch(url);
                if (!res.ok) throw new Error('Direct fetch failed');
                return await res.json();
            } catch (err) {
                console.warn('Direct fetch failed, trying proxy...', err);
                try {

                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const res = await fetch(proxyUrl);
                    const data = await res.json();
                    return JSON.parse(data.contents);
                } catch (proxyErr) {
                    console.error('Proxy fetch also failed:', proxyErr);
                    return null;
                }
            }
        };

                        if (localPlayers.length === 0) setLoading(true);


                        try {
                            const res = await fetch(`https://site.api.espn.com/apis/common/v3/search?q=${encodeURIComponent(query)}&limit=5&type=athlete&sport=basketball&league=nba`);

                            if (res.ok) {
                                const data = await res.json();
                                if (data.results) {
                                    const apiPlayers = data.results.map(r => ({
                                        id: r.contents[0].id,
                                        displayName: r.contents[0].displayName,
                                        team: r.contents[0].team ? { displayName: r.contents[0].team.displayName, logo: r.contents[0].team.logos?.[0]?.href } : null,
                                        headshot: r.contents[0].headshot?.href
                                    }));


                                    setResults(prev => {
                                        const currentPlayers = [...prev.players];
                                        const existingIds = new Set(currentPlayers.map(p => p.id));
                                        const newPlayers = apiPlayers.filter(p => !existingIds.has(p.id));
                                        const mergedPlayers = [...currentPlayers, ...newPlayers];
                                        return {
                                            ...prev,
                                            players: mergedPlayers
                                        };
                                    });
                                }
                            }
                        } catch (e) {

                            console.warn('Player search API failed or blocked, keeping local results only');
                        } finally {
                            setLoading(false);
                        }
                    }

                    setIsOpen(true);
                }, 500);

                return () => clearTimeout(timer);
            }, [query]);


            React.useEffect(() => {
                const handleClickOutside = (event) => {
                    if (searchRef.current && !searchRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return React.createElement('div', { className: "relative hidden md:block w-64 lg:w-96", ref: searchRef },
                React.createElement('div', { className: "relative group" },
                    React.createElement('div', { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none" },
                        loading ?
                            React.createElement('svg', { className: "w-4 h-4 text-blue-500 animate-spin", fill: "none", viewBox: "0 0 24 24" }, React.createElement('circle', { className: "opacity-25", cx: "12", cy: "12", r: "10", stroke: "currentColor", strokeWidth: "4" }), React.createElement('path', { className: "opacity-75", fill: "currentColor", d: "M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" })) :
                            React.createElement('svg', { className: "w-4 h-4 text-slate-400 group-focus-within:text-blue-400 transition-colors", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" }))
                    ),
                    React.createElement('input', {
                        type: "text",
                        className: "block w-full pl-10 pr-3 py-2 bg-slate-800/50 border border-slate-700 rounded-full leading-5 text-slate-300 placeholder-slate-500 focus:outline-none focus:bg-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 sm:text-sm transition-all duration-200",
                        placeholder: "Search players, games, or teams...",
                        value: query,
                        onChange: (e) => setQuery(e.target.value),
                        onFocus: () => query.length >= 2 && setIsOpen(true)
                    })
                ),


                isOpen && (results.teams.length > 0 || results.players.length > 0 || (results.matchups && results.matchups.length > 0)) && React.createElement('div', { className: "absolute mt-2 w-full bg-slate-900 rounded-xl shadow-2xl border border-slate-700 overflow-hidden z-[100] animate-in fade-in zoom-in-95 duration-200" },


                    results.matchups && results.matchups.length > 0 && React.createElement('div', { className: "p-2 border-b border-slate-800" },
                        React.createElement('div', { className: "px-3 py-2 text-[10px] uppercase font-bold text-slate-500 tracking-wider" }, "Recent Matchups"),
                        results.matchups.map(game => (
                            React.createElement('div', {
                                key: game.id,
                                onClick: () => {
                                    onSelectGame({
                                        id: game.id,
                                        time: game.status,
                                        visitor_team: {
                                            id: game.away.id,
                                            abbreviation: game.away.abbr,
                                            full_name: game.away.full_name,
                                            logo: game.away.logo,
                                            score: game.away.score
                                        },
                                        home_team: {
                                            id: game.home.id,
                                            abbreviation: game.home.abbr,
                                            full_name: game.home.full_name,
                                            logo: game.home.logo,
                                            score: game.home.score
                                        }
                                    });
                                    setIsOpen(false);
                                    setQuery('');
                                },
                                className: "flex flex-col p-3 rounded-lg hover:bg-white/5 cursor-pointer transition-colors border-b border-white/5 last:border-0"
                            },
                                React.createElement('span', { className: "text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 text-center" }, game.date),
                                React.createElement('div', { className: "flex items-center justify-between px-2" },

                                    React.createElement('div', { className: "flex items-center justify-between flex-1 pr-3" },
                                        React.createElement('div', { className: "flex items-center gap-2" },
                                            React.createElement('img', { src: game.away?.logo, className: "w-6 h-6 object-contain", onError: (e) => e.target.style.display = 'none' }),
                                            React.createElement('span', { className: "text-sm font-bold text-white" }, game.away?.abbr)
                                        ),
                                        React.createElement('span', { className: `text-xl font-bold ${game.away?.score >= game.home?.score ? 'text-white' : 'text-slate-500'}` }, game.away?.score)
                                    ),

                                    React.createElement('span', { className: "text-[10px] text-slate-600 font-bold" }, "VS"),

                                    React.createElement('div', { className: "flex items-center justify-between flex-1 pl-3" },
                                        React.createElement('span', { className: `text-xl font-bold ${game.home?.score >= game.away?.score ? 'text-white' : 'text-slate-500'}` }, game.home?.score),
                                        React.createElement('div', { className: "flex items-center gap-2" },
                                            React.createElement('span', { className: "text-sm font-bold text-white" }, game.home?.abbr),
                                            React.createElement('img', { src: game.home?.logo, className: "w-6 h-6 object-contain", onError: (e) => e.target.style.display = 'none' })
                                        )
                                    )
                                )
                            )
                        ))
                    ),


                    results.teams.length > 0 && React.createElement('div', { className: "p-2" },
                        React.createElement('div', { className: "px-3 py-2 text-[10px] uppercase font-bold text-slate-500 tracking-wider" }, "Teams"),
                        results.teams.map(team => (
                            React.createElement('div', {
                                key: team.id,
                                onClick: () => {
                                    onSelectTeam(team.id);
                                    setIsOpen(false);
                                    setQuery('');
                                },
                                className: "flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 cursor-pointer transition-colors"
                            },
                                React.createElement('img', { src: team.logo, className: "w-6 h-6 object-contain" }),
                                React.createElement('span', { className: "text-sm text-white font-medium" }, team.displayName)
                            )
                        ))
                    ),


                    results.teams.length > 0 && results.players.length > 0 && React.createElement('div', { className: "h-px bg-slate-800 mx-2" }),


                    results.players.length > 0 && React.createElement('div', { className: "p-2" },
                        React.createElement('div', { className: "px-3 py-2 text-[10px] uppercase font-bold text-slate-500 tracking-wider" }, "Players"),
                        results.players.map(player => (
                            React.createElement('div', {
                                key: player.id,
                                onClick: () => {
                                    onSelectPlayer(player.id);
                                    setIsOpen(false);
                                    setQuery('');
                                },
                                className: "flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 cursor-pointer transition-colors"
                            },
                                React.createElement('img', {
                                    src: player.headshot || 'https://via.placeholder.com/40',
                                    className: "w-8 h-8 rounded-full bg-slate-800 object-cover",
                                    onError: (e) => e.target.src = "https://via.placeholder.com/40"
                                }),
                                React.createElement('div', { className: "flex flex-col" },
                                    React.createElement('span', { className: "text-sm text-white font-medium" }, player.displayName),
                                    player.team && React.createElement('span', { className: "text-xs text-slate-400" }, player.team.displayName)
                                )
                            )
                        ))
                    )
                )
            );
        };


        const App = () => {
            const [view, setView] = React.useState('scores');
            const [recentGames, setRecentGames] = React.useState([]);
            const [futureGames, setFutureGames] = React.useState([]);


            const [pastCursor, setPastCursor] = React.useState(new Date());
            const [futureCursor, setFutureCursor] = React.useState(new Date());

            const [loadingInitial, setLoadingInitial] = React.useState(true);
            const [loadingMoreRecent, setLoadingMoreRecent] = React.useState(false);
            const [loadingMoreFuture, setLoadingMoreFuture] = React.useState(false);


            const [selectedGame, setSelectedGame] = React.useState(null);
            const [selectedTeamId, setSelectedTeamId] = React.useState(null);
            const [selectedPlayerId, setSelectedPlayerId] = React.useState(null);
            const [showPlayerPreview, setShowPlayerPreview] = React.useState(false);
            const [playerSummary, setPlayerSummary] = React.useState(null);


            React.useEffect(() => {
                const handleOpenPlayer = (e) => {
                    const { playerId } = e.detail;
                    if (playerId) {
                        fetch(`https://site.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${playerId}`)
                            .then(res => res.json())
                            .then(data => {
                                const athlete = data.athlete;
                                setPlayerSummary({
                                    id: athlete.id,
                                    name: athlete.displayName,
                                    jersey: athlete.jersey,
                                    position: athlete.position?.name,
                                    height: athlete.displayHeight,
                                    weight: athlete.displayWeight,
                                    headshot: athlete.headshot?.href,
                                    team: athlete.team
                                });
                                setSelectedPlayerId(playerId);
                                setShowPlayerPreview(true);
                            });
                    }
                };
                window.addEventListener('openPlayerProfile', handleOpenPlayer);
                return () => window.removeEventListener('openPlayerProfile', handleOpenPlayer);
            }, []);


            const initLoad = async () => {
                setLoadingInitial(true);

                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);

                const nextPast = new Date(yesterday);
                nextPast.setDate(nextPast.getDate() - 1);
                setPastCursor(nextPast);

                const nextFuture = new Date(today);
                nextFuture.setDate(nextFuture.getDate() + 1);
                setFutureCursor(nextFuture);

                const [todayGames, yesterdayGames] = await Promise.all([
                    fetchGamesForDate(today),
                    fetchGamesForDate(yesterday)
                ]);

                const allGames = [...todayGames, ...yesterdayGames];

                const recent = allGames.filter(g => g.status !== 'Scheduled').sort((a, b) => {
                    if (a.status === 'Live' && b.status !== 'Live') return -1;
                    if (b.status === 'Live' && a.status !== 'Live') return 1;
                    return new Date(b.date) - new Date(a.date);
                });

                const future = allGames.filter(g => g.status === 'Scheduled').sort((a, b) => {
                    return new Date(a.date) - new Date(b.date);
                });

                setRecentGames(recent);
                setFutureGames(future);
                setLoadingInitial(false);
            };

            React.useEffect(() => {
                initLoad();
            }, []);

            const loadMoreRecent = async () => {
                setLoadingMoreRecent(true);
                const dateToFetch = new Date(pastCursor);
                const newGames = await fetchGamesForDate(dateToFetch);

                setRecentGames(prev => {
                    const combined = [...newGames, ...prev];
                    const unique = Array.from(new Map(combined.map(item => [item.id, item])).values());
                    return unique.sort((a, b) => {
                        if (a.status === 'Live' && b.status !== 'Live') return -1;
                        if (b.status === 'Live' && a.status !== 'Live') return 1;
                        return new Date(b.date) - new Date(a.date);
                    });
                });

                const nextCursor = new Date(pastCursor);
                nextCursor.setDate(nextCursor.getDate() - 1);
                setPastCursor(nextCursor);

                setLoadingMoreRecent(false);
            };

            const loadMoreFuture = async () => {
                setLoadingMoreFuture(true);
                const dateToFetch = new Date(futureCursor);
                const newGames = await fetchGamesForDate(dateToFetch);

                setFutureGames(prev => {
                    const combined = [...prev, ...newGames];
                    const unique = Array.from(new Map(combined.map(item => [item.id, item])).values());
                    return unique.sort((a, b) => new Date(a.date) - new Date(b.date));
                });

                const nextCursor = new Date(futureCursor);
                nextCursor.setDate(nextCursor.getDate() + 1);
                setFutureCursor(nextCursor);

                setLoadingMoreFuture(false);
            };

            return (
                <div className="min-h-screen bg-[#0F172A] pb-20">
                    <header className="sticky top-0 z-50 glass-panel border-b border-white/10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('scores')}>
                                <div className="w-8 h-8 bg-gradient-to-br from-blue-600 to-red-600 rounded-full flex items-center justify-center text-white font-bold text-xs ring-2 ring-white/20">
                                    NBA
                                </div>
                                <h1 className="text-xl font-bold tracking-tight hidden sm:block">
                                    Hoops<span className="text-blue-400">Hub</span>
                                </h1>
                                <span className="hidden md:block text-slate-400 text-xl font-bold">· Live Scores</span>
                            </div>

                            { }
                            <SearchBar
                                onSelectTeam={(teamId) => {
                                    setSelectedTeamId(teamId);
                                }}
                                onSelectPlayer={(playerId) => {
                                    const event = new CustomEvent('openPlayerProfile', { detail: { playerId } });
                                    window.dispatchEvent(event);
                                }}
                                onSelectGame={setSelectedGame}
                            />

                            <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
                                <button onClick={() => setView('scores')} className={`transition-colors ${view === 'scores' ? 'text-white font-bold' : 'hover:text-blue-400'}`}>Games</button>
                                <button onClick={() => setView('stats')} className={`transition-colors ${view === 'stats' ? 'text-white font-bold' : 'hover:text-blue-400'}`}>Standings</button>

                            </nav>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {view === 'scores' && (
                            <>

                                {loadingInitial ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {[1, 2, 3, 4, 5, 6].map((i) => (
                                            <div key={i} className="glass-panel h-64 rounded-2xl animate-pulse"></div>
                                        ))}
                                    </div>
                                ) : (
                                    <>
                                        <GameGrid
                                            games={recentGames}
                                            title="Recent Games"
                                            onLoadMore={loadMoreRecent}
                                            isLoadingMore={loadingMoreRecent}
                                            loadingInitial={loadingInitial}
                                            onCardClick={setSelectedGame}
                                        />
                                        <div className="h-px bg-slate-800 my-12 w-full"></div>
                                        <GameGrid
                                            games={futureGames}
                                            title="Upcoming Games"
                                            onLoadMore={loadMoreFuture}
                                            isLoadingMore={loadingMoreFuture}
                                            loadingInitial={loadingInitial}
                                            onCardClick={setSelectedGame}
                                        />
                                    </>
                                )}
                            </>
                        )}

                        {view === 'stats' && (
                            <div className="animate-fade-in">
                                <StandingsView onTeamClick={setSelectedTeamId} />
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-white/5 py-8 text-center text-slate-500 text-sm">
                        <p>HoopsHub · NBA Scores · Made by Nico</p>
                    </footer>

                    { }

                    {selectedGame && (
                        <GameDetailsModal
                            game={selectedGame}
                            onClose={() => setSelectedGame(null)}
                            onTeamClick={(teamId) => {
                                setSelectedGame(null);
                                setSelectedTeamId(teamId);
                            }}
                        />
                    )}

                    {selectedTeamId && (
                        <TeamProfileModal
                            teamId={selectedTeamId}
                            onClose={() => setSelectedTeamId(null)}
                        />
                    )}

                    {selectedPlayerId && showPlayerPreview && (
                        <PlayerDetailsModal
                            playerId={selectedPlayerId}
                            onClose={() => setSelectedPlayerId(null)}
                            onShowProfile={() => setShowPlayerPreview(false)}
                        />
                    )}

                    {selectedPlayerId && !showPlayerPreview && (
                        <PlayerProfileModal
                            playerId={selectedPlayerId}
                            playerSummary={playerSummary}
                            onClose={() => setSelectedPlayerId(null)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
